networks:
  ottoman-net:
    driver: bridge

volumes:
  mysql_data:

services:

  # ==================== INFRASTRUCTURE ====================

  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql-init:/docker-entrypoint-initdb.d
    networks:
      - ottoman-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - ottoman-net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - ottoman-net

  # ==================== CORE PLATFORM ====================

  eureka-server:
    image: mohammadirfan123/ottoman-eureka-service:latest
    container_name: eureka-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    networks:
      - ottoman-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  config-server:
    image: mohammadirfan123/ottoman-config-server:latest
    container_name: config-server
    restart: unless-stopped
    environment:
      EUREKA_HOST: eureka-server
    ports:
      - "8888:8888"
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - ottoman-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==================== BUSINESS SERVICES ====================

  auth-service:
    image: mohammadirfan123/ottoman-auth-service:latest
    container_name: auth-service
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      EUREKA_HOST: eureka-server
      CONFIG_SERVER_HOST: config-server
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - ottoman-net

  account-service:
    image: mohammadirfan123/ottoman-account-service:latest
    container_name: account-service
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      EUREKA_HOST: eureka-server
      CONFIG_SERVER_HOST: config-server
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - ottoman-net

  transaction-service:
    image: mohammadirfan123/ottoman-transaction-service:latest
    container_name: transaction-service
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      EUREKA_HOST: eureka-server
      CONFIG_SERVER_HOST: config-server
      KAFKA_HOST: kafka
      ACCOUNT_SERVICE_HOST: account-service
    ports:
      - "8083:8083"
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      kafka:
        condition: service_started
      account-service:
        condition: service_started
    networks:
      - ottoman-net

  notification-service:
    image: mohammadirfan123/ottoman-notification-service:latest
    container_name: notification-service
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_HOST: eureka-server
      CONFIG_SERVER_HOST: config-server
      KAFKA_HOST: kafka
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - ottoman-net

  audit-service:
    image: mohammadirfan123/ottoman-audit-service:latest
    container_name: audit-service
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_HOST: eureka-server
      CONFIG_SERVER_HOST: config-server
      KAFKA_HOST: kafka
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - ottoman-net

  api-gateway:
    image: mohammadirfan123/ottoman-api-gateway:latest
    container_name: api-gateway
    restart: unless-stopped
    environment:
      EUREKA_HOST: eureka-server
      CONFIG_SERVER_HOST: config-server
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8089:8080"
    depends_on:
      eureka-server:
        condition: service_healthy
      auth-service:
        condition: service_started
      account-service:
        condition: service_started
      transaction-service:
        condition: service_started
    networks:
      - ottoman-net

  # ==================== FRONTEND ====================

  frontend:
    image: mohammadirfan123/ottoman-frontend:latest
    container_name: frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api-gateway
    networks:
      - ottoman-net

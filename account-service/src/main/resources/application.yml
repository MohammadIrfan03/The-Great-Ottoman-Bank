server:
  port: 8082

spring:
  application:
    name: account-service
  config:
    import: optional:configserver:http://${CONFIG_SERVER_HOST:localhost}:8888
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/account_db?createDatabaseIfNotExist=true
    username: ottoman_user
    password: 'OttomanBank@2026'
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      initialization-final-timeout: -1
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: ottoman-bank-super-secret-signing-key-change-this-in-production-min-256-bits

management:
  endpoints:
    web:
      exposure:
        include: health,info
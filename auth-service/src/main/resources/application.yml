server:
  port: 8081

spring:
  application:
    name: auth-service
  config:
    import: optional:configserver:http://${CONFIG_SERVER_HOST:localhost}:8888
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/auth_db?createDatabaseIfNotExist=true
    username: ottoman_user
    password: 'OttomanBank@2026'
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: ottoman-bank-super-secret-signing-key-change-this-in-production-min-256-bits
  expiration-ms: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info
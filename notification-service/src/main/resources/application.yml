
server:
  port: 8083

spring:
  application:
    name: transaction-service
  config:
    import: optional:configserver:http://${CONFIG_SERVER_HOST:localhost}:8888
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/transaction_db?createDatabaseIfNotExist=true
    username: ottoman_user
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:9092

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET}

services:
  account-service:
    url: http://${ACCOUNT_SERVICE_HOST:localhost}:8082

management:
  endpoints:
    web:
      exposure:
        include: health,info

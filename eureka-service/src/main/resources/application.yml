server:
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  instance:
    hostname: localhost
  client:
    # The registry itself should not register with or fetch from another registry
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    # Disable self-preservation in dev so stale instances are evicted quickly.
    # In production, keep this true — it protects against network partitions
    # incorrectly evicting healthy instances.
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info

info:
  app:
    name: The Great Ottoman Bank - Service Registry
    description: Central discovery server (Divan) for all bank microservices
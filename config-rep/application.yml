server:
  port: 8888

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          # Points to the config-repo subfolder within this same monorepo.
          # search-paths lets us keep configs in a subdirectory rather than
          # requiring a dedicated repository.
          uri: https://github.com/MohammadIrfan03/The-Great-Ottoman-Bank
          search-paths: config-repo
          default-label: main
          clone-on-start: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh

info:
  app:
    name: The Great Ottoman Bank - Configuration Server
    description: Centralized, Git-backed configuration (Firman Divani) for all bank microservices